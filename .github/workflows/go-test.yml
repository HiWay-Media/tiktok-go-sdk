name: Go test workflow
on: [push]
#
env:
  APP_ENV: runner
  # Setting an environment variable with the value of a configuration variable
  CLIENT_KEY: ${{ secrets.CLIENT_KEY }}
  # Setting an environment variable with the value of a configuration variable
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  #
#
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [  '1.19.x', '1.20.x', '1.21.x', '1.22.x' ]
    #
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          #cache-dependency-path: subdir/go.sum
      #
      # You can test your matrix by printing the current Go version
      - name: Display Go version
        run: go version
      #
      - name: Install dependencies
        run: go mod tidy
      #
      - name: Build
        run: go build -v ./... 
      #
      - name: Test with the Go CLI
        run: go test -v ./...
      #
    #
  #
  # Format gate (TT-34). Pinned to one toolchain on purpose: gofmt's output has
  # changed across Go releases (doc comments in 1.19), so a floating version
  # would make the gate disagree with itself between runs.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            echo "run: gofmt -w ." >&2
            exit 1
          fi
          echo "all files are gofmt'd"
  #