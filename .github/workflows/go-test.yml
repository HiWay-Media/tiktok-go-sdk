name: Go test workflow
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.19.x", "1.20.x", "1.21.x", "1.22.x"]
    # The legacy tests in test/ read these from the environment (TT-22 moves the
    # ones that hit the real API behind a build tag). Scoped to this job on
    # purpose: a secret exported at workflow level is handed to every job,
    # including ones that only format-check the tree.
    env:
      APP_ENV: runner
      CLIENT_KEY: ${{ secrets.CLIENT_KEY }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Display Go version
        run: go version
      # `go mod tidy` would rewrite go.mod/go.sum in place and make CI pass on a
      # tree that does not build from a clean checkout. Download and verify
      # instead: an inconsistent go.mod must fail here, not be repaired here.
      - name: Download dependencies
        run: |
          go mod download
          go mod verify
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      # -race is a gate, not a nicety: the client is shared across goroutines
      # and its access token can be replaced at any time (TT-32).
      - name: Test with the Go CLI
        run: go test -race -v ./...

  # Format gate (TT-34). Pinned to one toolchain on purpose: gofmt's output has
  # changed across Go releases (doc comments in 1.19), so a floating version
  # would make the gate disagree with itself between runs.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            echo "run: gofmt -w ." >&2
            exit 1
          fi
          echo "all files are gofmt'd"
